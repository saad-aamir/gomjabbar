# Continuous integration: install, lint, test. No paid calls, no Docker, no Ollama (SPEC 13).
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      # Install the project and dev dependencies into .venv.
      - run: uv sync
      # Lint and format check.
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Unit and integration tests (fake server and scripted LLM only). Tests marked
      # `postgres` need Docker and skip here with a reason; -rs prints the reasons.
      - run: uv run pytest -q -rs
