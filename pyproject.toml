# Project metadata and tool configuration for Prüfstand.
# Dependencies are managed with uv: `uv sync` installs them into .venv.

[project]
name = "pruefstand"
version = "0.1.0"
description = "Chaos testing for tool-using AI agents: reliability, robustness, security and behavioural stability over MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.30,<2",          # 1.x API (stdio_client, ClientSession, FastMCP); see docs/notes/mcp-stdio.md
    "litellm>=1.50",         # one interface to every model provider
    "pydantic>=2.6",         # data contracts in models.py
    "pyyaml>=6",             # configs and payload files
    "typer>=0.12",           # command line interface
    "jinja2>=3.1",           # HTML report (M3)
    "numpy>=1.26",           # bootstrap
    "pandas>=2.1",           # analysis tables
    "statsmodels>=0.14",     # McNemar test
]

[project.scripts]
pruefstand = "pruefstand.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pruefstand"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["vendor", "*.md"]  # ruff 0.16 would also reformat code blocks inside Markdown

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]  # the formatter wraps code; long string literals are left as they are

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options as argument defaults; these calls are safe there.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
